<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c9a84c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>KhutbaBox — Khutba Live</title>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #06101d;
      color: #f5f0e8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── EN-TÊTE ── */
    header {
      text-align: center;
      padding: 30px 20px 20px;
    }
    header::after {
      content: '';
      display: block;
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 18px auto 0;
    }
    .bismillah {
      font-family: 'Traditional Arabic', 'Scheherazade', serif;
      font-size: 28px;
      color: #c9a84c;
      line-height: 1.6;
    }
    .titre {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 3px;
      color: #f5f0e8;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .mihrab {
      width: 80px;
      height: 40px;
      border: 2px solid #c9a84c;
      border-bottom: none;
      border-radius: 80px 80px 0 0;
      margin: 14px auto 0;
      opacity: 0.5;
    }

    /* ── CONTENEUR PRINCIPAL ── */
    main { padding: 20px; max-width: 440px; margin: 0 auto; }

    /* ── ÉCRAN CHOIX ── */
    .section-titre {
      font-size: 14px;
      color: #c9a84c;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      text-align: center;
    }
    .grille-langues {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }
    .btn-langue, .btn-voix {
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 10px;
      color: #f5f0e8;
      padding: 14px 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-langue:hover, .btn-voix:hover {
      border-color: #c9a84c;
    }
    .btn-langue.actif, .btn-voix.actif {
      background: #c9a84c;
      color: #06101d;
      border-color: #c9a84c;
      font-weight: 600;
    }
    .grille-voix {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 32px;
    }
    .btn-commencer {
      display: block;
      width: 100%;
      padding: 16px;
      background: #c9a84c;
      color: #06101d;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    .btn-commencer:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ── ÉCRAN LIVE ── */
    #ecran-live { display: none; }

    .badges-live {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .badge-direct {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #22c55e;
    }
    .pastille-verte {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: clignote 1.2s ease-in-out infinite;
    }
    .badge-mode {
      display: inline-flex;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-mode.azure {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
    }
    .badge-mode.legacy {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #facc15;
    }
    @keyframes clignote {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Visualiseur audio */
    .visualiseur {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 50px;
      margin-bottom: 28px;
    }
    .barre {
      width: 6px;
      background: #c9a84c;
      border-radius: 3px;
      height: 4px;
      transition: height 0.15s;
    }
    .barre.anime { animation: rebond var(--duree) ease-in-out infinite; }
    @keyframes rebond {
      0%, 100% { height: 8px; }
      50% { height: var(--hauteur); }
    }

    /* ── Zone traduction — sous-titres live ── */
    .zone-traduction {
      background: rgba(245, 240, 232, 0.04);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 14px;
      padding: 22px 18px;
      margin-bottom: 20px;
      min-height: 120px;
    }
    .texte-partiel {
      font-size: 18px;
      line-height: 1.6;
      color: rgba(245, 240, 232, 0.5);
      font-style: italic;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.1);
      margin-bottom: 14px;
    }
    .historique {
      max-height: 300px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .phrase-finale {
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.08);
    }
    .phrase-finale:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .phrase-texte {
      font-size: 20px;
      line-height: 1.6;
      color: #f5f0e8;
    }
    .placeholder-texte {
      color: rgba(245, 240, 232, 0.3);
      font-style: italic;
      font-size: 15px;
      text-align: center;
      padding: 20px 0;
    }

    .btn-arreter {
      display: block;
      width: 100%;
      padding: 14px;
      background: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-arreter:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* ── UTILITAIRES ── */
    .cache { display: none !important; }
    .centre { text-align: center; }
  </style>
</head>
<body>

  <!-- ── EN-TÊTE ── -->
  <header>
    <div class="bismillah">بسم الله الرحمن الرحيم</div>
    <div class="titre">Khutba Live</div>
    <div class="mihrab"></div>
  </header>

  <main>

    <!-- ── ÉCRAN 1 : CHOIX ── -->
    <div id="ecran-choix">

      <p class="section-titre">Choisissez votre langue</p>
      <div class="grille-langues">
        <button class="btn-langue" data-lang="fr">🇫🇷 Français</button>
        <button class="btn-langue" data-lang="en">🇬🇧 English</button>
        <button class="btn-langue" data-lang="es">🇪🇸 Español</button>
        <button class="btn-langue" data-lang="pt">🇧🇷 Português</button>
        <button class="btn-langue" data-lang="tr">🇹🇷 Türkçe</button>
        <button class="btn-langue" data-lang="ur">🇵🇰 اردو</button>
        <button class="btn-langue" data-lang="bs">🇧🇦 Bosanski</button>
        <button class="btn-langue" data-lang="sq">🇦🇱 Shqip</button>
      </div>

      <p class="section-titre">Choisissez la voix</p>
      <div class="grille-voix">
        <button class="btn-voix" data-voix="male">🔊 Homme</button>
        <button class="btn-voix" data-voix="female">🔊 Femme</button>
      </div>

      <button class="btn-commencer" id="btn-commencer" disabled>
        Commencer l'écoute
      </button>
    </div>

    <!-- ── ÉCRAN 2 : LIVE ── -->
    <div id="ecran-live">

      <div class="badges-live">
        <div class="badge-direct">
          <span class="pastille-verte"></span>
          EN DIRECT
        </div>
        <div class="badge-mode legacy" id="badge-mode">Legacy</div>
      </div>

      <div class="visualiseur" id="visualiseur">
        <div class="barre" style="--hauteur: 35px; --duree: 0.5s;"></div>
        <div class="barre" style="--hauteur: 50px; --duree: 0.7s;"></div>
        <div class="barre" style="--hauteur: 40px; --duree: 0.4s;"></div>
        <div class="barre" style="--hauteur: 48px; --duree: 0.6s;"></div>
        <div class="barre" style="--hauteur: 30px; --duree: 0.55s;"></div>
      </div>

      <div class="message-special cache" id="message-special"
        style="text-align:center; padding:30px 20px; margin-bottom:20px;
               background:rgba(201,168,76,0.1); border:1px solid rgba(201,168,76,0.3);
               border-radius:14px;">
        <div style="font-size:32px; margin-bottom:12px;" id="message-special-icon"></div>
        <div id="message-special-texte"
          style="font-size:18px; color:#c9a84c; font-weight:500;"></div>
      </div>

      <div class="zone-traduction" id="zone-traduction">
        <div class="texte-partiel cache" id="texte-partiel"></div>
        <div class="historique" id="historique">
          <div class="placeholder-texte" id="placeholder">
            En attente de la parole de l'imam...
          </div>
        </div>
      </div>

      <button class="btn-arreter" id="btn-arreter">Arrêter</button>
    </div>

  </main>

  <script>
    /* ============================================================
       VARIABLES GLOBALES
       ============================================================ */
    let langueChoisie = null;
    let voixChoisie = null;
    let ws = null;
    let audioCtx = null;        // AudioContext pour unlock mobile
    let modeBackend = 'legacy'; // azure ou legacy
    const MAX_HISTORIQUE = 10;  // nombre max de phrases affichées

    // Audio queue — un seul élément audio réutilisé (compatibilité mobile)
    const audioQueue = [];
    let isPlaying = false;
    let audioElement = null;    // élément audio persistant créé au clic

    /* ============================================================
       ÉLÉMENTS DU DOM
       ============================================================ */
    const ecranChoix = document.getElementById('ecran-choix');
    const ecranLive = document.getElementById('ecran-live');
    const btnCommencer = document.getElementById('btn-commencer');
    const btnArreter = document.getElementById('btn-arreter');
    const placeholder = document.getElementById('placeholder');
    const textePartiel = document.getElementById('texte-partiel');
    const historiqueDiv = document.getElementById('historique');
    const badgeMode = document.getElementById('badge-mode');
    const visualiseur = document.getElementById('visualiseur');
    const barres = visualiseur.querySelectorAll('.barre');

    /* ============================================================
       ÉCRAN 1 — SÉLECTION LANGUE ET VOIX
       ============================================================ */

    // Sélection langue
    document.querySelectorAll('.btn-langue').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-langue').forEach(b => b.classList.remove('actif'));
        btn.classList.add('actif');
        langueChoisie = btn.dataset.lang;
        verifierPret();
      });
    });

    // Sélection voix
    document.querySelectorAll('.btn-voix').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-voix').forEach(b => b.classList.remove('actif'));
        btn.classList.add('actif');
        voixChoisie = btn.dataset.voix;
        verifierPret();
      });
    });

    function verifierPret() {
      btnCommencer.disabled = !(langueChoisie && voixChoisie);
    }

    /* ============================================================
       CONNEXION WEBSOCKET
       ============================================================ */

    btnCommencer.addEventListener('click', () => {
      // Débloquer l'audio sur mobile — le clic utilisateur autorise l'AudioContext
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      const silentBuffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = silentBuffer;
      source.connect(audioCtx.destination);
      source.start();

      // Créer un élément audio persistant pendant le geste utilisateur (obligatoire sur mobile)
      audioElement = new Audio();
      audioElement.volume = 1.0;
      // Jouer un silence pour débloquer l'autoplay sur iOS/Android
      audioElement.src = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYYoRwBHAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=';
      audioElement.play().then(() => {
        console.log('[KhutbaBox] Audio mobile débloqué');
      }).catch(() => {
        console.warn('[KhutbaBox] Impossible de débloquer audio mobile');
      });

      const protocole = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocole}//${window.location.host}/ws/listen`;

      ws = new WebSocket(url);

      ws.onopen = () => {
        ws.send(JSON.stringify({ lang: langueChoisie, voice: voixChoisie }));
        ecranChoix.style.display = 'none';
        ecranLive.style.display = 'block';
        demarrerVisualiseur();
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
          case 'status':
            modeBackend = msg.mode || 'legacy';
            mettreAJourBadgeMode();
            // Gestion mode Coran/Adhan
            if (msg.mode === 'quran') {
              afficherMessageSpecial('Récitation du Saint Coran en cours...', '\u{1F54C}');
            } else if (msg.mode === 'adhan') {
              afficherMessageSpecial("Appel à la prière (Adhan) en cours...", '\u{1F54C}');
            } else if (msg.mode === 'live' || msg.mode === 'stopped') {
              masquerMessageSpecial();
            }
            break;
          case 'partial':
            afficherPartiel(msg.text);
            break;
          case 'final_text':
            afficherFinal(msg.text);
            break;
          case 'audio_chunk':
            console.log('[KhutbaBox] audio_chunk reçu:', msg.data ? msg.data.length + ' chars base64' : 'PAS DE DATA');
            jouerAudio(msg.data, msg.format || 'mp3');
            break;
          case 'traduction':
            // Rétrocompatibilité pipeline Legacy
            afficherFinal(msg.traduction);
            if (msg.audio_base64) {
              jouerAudio(msg.audio_base64, msg.audio_format || 'mp3');
            }
            break;
        }
      };

      ws.onclose = () => { arreterEcoute(); };
      ws.onerror = () => { arreterEcoute(); };
    });

    /* ============================================================
       BADGE MODE (Azure / Legacy)
       ============================================================ */

    function mettreAJourBadgeMode() {
      badgeMode.textContent = modeBackend === 'azure' ? 'Azure' : 'Legacy';
      badgeMode.className = 'badge-mode ' + (modeBackend === 'azure' ? 'azure' : 'legacy');
    }

    /* ============================================================
       AFFICHAGE — Sous-titres live
       ============================================================ */

    function afficherPartiel(text) {
      if (!text) return;
      placeholder.classList.add('cache');
      textePartiel.textContent = text;
      textePartiel.classList.remove('cache');
    }

    function afficherFinal(text) {
      if (!text) return;
      placeholder.classList.add('cache');

      // Masquer le texte partiel
      textePartiel.classList.add('cache');
      textePartiel.textContent = '';

      // Créer un bloc phrase finale
      const phrase = document.createElement('div');
      phrase.className = 'phrase-finale';
      const texte = document.createElement('div');
      texte.className = 'phrase-texte';
      texte.textContent = text;
      phrase.appendChild(texte);
      historiqueDiv.appendChild(phrase);

      // Limiter l'historique
      const phrases = historiqueDiv.querySelectorAll('.phrase-finale');
      while (phrases.length > MAX_HISTORIQUE) {
        historiqueDiv.removeChild(phrases[0]);
        // Re-query after removal
        break;
      }

      // Scroll auto vers le bas
      historiqueDiv.scrollTop = historiqueDiv.scrollHeight;
    }

    function afficherMessageSpecial(texte, icone) {
      document.getElementById('message-special-icon').textContent = icone || '';
      document.getElementById('message-special-texte').textContent = texte;
      document.getElementById('message-special').classList.remove('cache');
      document.getElementById('zone-traduction').classList.add('cache');
    }

    function masquerMessageSpecial() {
      document.getElementById('message-special').classList.add('cache');
      document.getElementById('zone-traduction').classList.remove('cache');
    }

    /* ============================================================
       AUDIO PLAYER — Blob URL (compatible mp3 + wav)
       ============================================================ */

    function jouerAudio(base64Data, format) {
      const mime = format === 'wav' ? 'audio/wav' : 'audio/mpeg';
      audioQueue.push({ data: base64Data, mime: mime });
      if (!isPlaying) jouerProchain();
    }

    function jouerProchain() {
      if (audioQueue.length === 0) {
        isPlaying = false;
        return;
      }
      isPlaying = true;
      const { data, mime } = audioQueue.shift();
      console.log('[KhutbaBox] Lecture audio:', mime, data ? data.length + ' chars' : 'vide');

      const bytes = Uint8Array.from(atob(data), c => c.charCodeAt(0));
      const blob = new Blob([bytes], { type: mime });
      const url = URL.createObjectURL(blob);

      // Réutiliser l'élément audio créé au clic (déjà autorisé par le navigateur mobile)
      const player = audioElement || new Audio();
      player.onended = () => {
        URL.revokeObjectURL(url);
        jouerProchain();
      };
      player.onerror = () => {
        console.warn('[KhutbaBox] Erreur lecture audio');
        URL.revokeObjectURL(url);
        jouerProchain();
      };
      player.src = url;
      player.play().then(() => {
        console.log('[KhutbaBox] Audio OK');
      }).catch((err) => {
        console.warn('[KhutbaBox] Audio bloqué:', err.message);
        URL.revokeObjectURL(url);
        jouerProchain();
      });
    }

    /* ============================================================
       VISUALISEUR AUDIO — Barres animées
       ============================================================ */

    function demarrerVisualiseur() {
      barres.forEach(b => b.classList.add('anime'));
    }

    function arreterVisualiseur() {
      barres.forEach(b => {
        b.classList.remove('anime');
        b.style.height = '4px';
      });
    }

    /* ============================================================
       ARRÊTER L'ÉCOUTE — Retour à l'écran choix
       ============================================================ */

    btnArreter.addEventListener('click', () => {
      if (ws) {
        ws.close();
        ws = null;
      }
      arreterEcoute();
    });

    function arreterEcoute() {
      audioQueue.length = 0;
      isPlaying = false;
      arreterVisualiseur();
      // Réinitialiser la zone traduction
      textePartiel.classList.add('cache');
      textePartiel.textContent = '';
      historiqueDiv.innerHTML = '';
      placeholder.classList.remove('cache');
      historiqueDiv.appendChild(placeholder);
      // Retour à l'écran choix
      ecranLive.style.display = 'none';
      ecranChoix.style.display = 'block';
    }
  </script>

</body>
</html>
